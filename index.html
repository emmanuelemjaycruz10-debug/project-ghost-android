<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PROJECT GHOST</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  background: #101820dd;
  padding: 12px;
  border-left: 3px solid #e0ad42;
  border-radius: 5px;
  font-size: 12px;
  pointer-events: none;
}

#hud strong {
  color: #e0ad42;
  font-size: 17px;
}

#health {
  width: 140px;
  height: 7px;
  background: #555;
  margin-top: 7px;
}

#healthbar {
  width: 100%;
  height: 100%;
  background: #48d17b;
}

#message {
  position: absolute;
  top: 110px;
  left: 12px;
  max-width: 230px;
  color: #fff;
  font-size: 12px;
  text-shadow: 1px 1px 3px #000;
  pointer-events: none;
}

#controls {
  position: absolute;
  bottom: 22px;
  left: 15px;
  display: grid;
  grid-template-columns: repeat(3, 52px);
  grid-template-rows: repeat(2, 52px);
  gap: 5px;
  z-index: 3;
}

button {
  color: white;
  background: #182631dd;
  border: 1px solid #e0ad42;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
}

button:active {
  background: #956c22;
}

#up { grid-column: 2; grid-row: 1; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#actions {
  position: absolute;
  right: 16px;
  bottom: 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 3;
}

#actions button {
  width: 76px;
  height: 64px;
  font-size: 12px;
}

#attack {
  background: #8b2020dd;
}

#hint {
  position: absolute;
  bottom: 5px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  color: #ddd;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="hud">
  <strong>PROJECT GHOST</strong><br>
  THE LAST SOLDIER<br>
  MISSION 01: ESCAPE<br>
  HEALTH
  <div id="health"><div id="healthbar"></div></div>
  <div id="stats">ENEMIES: 3</div>
</div>

<div id="message">Find the enemy soldiers. Survive. Escape.</div>

<div id="controls">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
</div>

<div id="actions">
  <button id="attack">ENERGY<br>BLAST</button>
  <button id="jump">JUMP</button>
</div>

<div id="hint">MOVE: ARROWS / WASD · ATTACK: SPACE</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91a9b5);
scene.fog = new THREE.Fog(0x91a9b5, 35, 110);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 300
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.prepend(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xddeeff, 0x554433, 2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe0b0, 2.5);
sun.position.set(15, 25, 12);
sun.castShadow = true;
scene.add(sun);

sun.shadow.mapSize.set(1024, 1024);

function material(color, roughness = 0.9) {
  return new THREE.MeshStandardMaterial({ color, roughness });
}

const groundMat = material(0x77785a);
const roadMat = material(0x393c40);
const concreteMat = material(0x9b9385);
const darkMat = material(0x202a29);
const goldMat = material(0xe0ad42);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  groundMat
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(11, 160),
  roadMat
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.025;
scene.add(road);

function box(w, h, d, mat, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d), mat
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// A small fictional Nigerian urban district.
for (let i = -4; i <= 4; i++) {
  if (i === 0) continue;

  for (let j = -3; j <= 3; j++) {
    if (Math.random() < 0.35) continue;

    const x = i * 10;
    const z = j * 12;

    if (Math.abs(x) < 12) continue;

    const height = 4 + Math.random() * 10;
    const width = 5 + Math.random() * 3;

    const colors = [
      0xc6a77b, 0xb7b0a1, 0x887c6b,
      0xd0b98e, 0x777c78
    ];

    box(
      width, height, 6,
      material(colors[Math.floor(Math.random() * colors.length)]),
      x, height / 2, z
    );

    // Dark windows.
    for (let wy = 1.5; wy < height - 1; wy += 2) {
      for (let wx = -width / 2 + 1; wx < width / 2 - 0.5; wx += 1.8) {
        box(
          0.65, 0.8, 0.08, darkMat,
          x + wx, wy, z + 3.04
        );
      }
    }
  }
}

// Roadside trees.
for (let i = 0; i < 24; i++) {
  const x = (Math.random() < 0.5 ? -1 : 1) *
    (8 + Math.random() * 5);
  const z = Math.random() * 100 - 50;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.35, 2.5, 7),
    material(0x61472f)
  );

  trunk.position.set(x, 1.25, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 7, 6),
    material(0x365b37)
  );

  leaves.position.set(x, 3.2, z);
  leaves.scale.set(1, 1.15, 1);
  scene.add(leaves);
}

// Character construction.
function createSoldier(color, isPlayer = false) {
  const root = new THREE.Group();

  const bodyMat = material(color);
  const skinMat = material(0x754a34);
  const bootsMat = material(0x252525);

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.05, 0.45),
    bodyMat
  );
  body.position.y = 1.65;
  body.castShadow = true;
  root.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.29, 12, 10),
    skinMat
  );
  head.position.y = 2.42;
  head.castShadow = true;
  root.add(head);

  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    material(isPlayer ? 0x18251e : 0x292d2b)
  );
  helmet.position.y = 2.52;
  root.add(helmet);

  const legs = [];

  for (const side of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.27, 0.8, 0.32),
      bootsMat
    );

    leg.position.set(side * 0.23, 0.65, 0);
    leg.castShadow = true;
    root.add(leg);
    legs.push(leg);

    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(0.23, 0.8, 0.27),
      bodyMat
    );

    arm.position.set(side * 0.54, 1.65, 0);
    arm.castShadow = true;
    root.add(arm);
  }

  if (isPlayer) {
    const core = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.24, 0.48),
      new THREE.MeshBasicMaterial({ color: 0x35dfff })
    );

    core.position.set(0, 1.7, -0.24);
    root.add(core);
  }

  root.userData.legs = legs;
  root.position.y = 0;
  scene.add(root);

  return root;
}

const player = createSoldier(0x364638, true);
player.position.set(0, 0, 8);

const enemies = [];

for (const position of [
  [-5, 0, -7],
  [4, 0, -13],
  [8, 0, -23]
]) {
  const enemy = createSoldier(0x6b3027);
  enemy.position.set(...position);
  enemies.push({ mesh: enemy, health: 100 });
}

const keys = {};
const movement = {
  up: false,
  down: false,
  left: false,
  right: false
};

let health = 100;
let verticalVelocity = 0;
let grounded = true;
let energyCooldown = 0;
let elapsed = 0;

function setMove(name, pressed) {
  movement[name] = pressed;
}

const bindings = {
  up: 'up',
  down: 'down',
  left: 'left',
  right: 'right'
};

for (const [id, name] of Object.entries(bindings)) {
  const button = document.getElementById(id);

  button.addEventListener('pointerdown', e => {
    e.preventDefault();
    setMove(name, true);
    button.setPointerCapture(e.pointerId);
  });

  const release = () => setMove(name, false);
  button.addEventListener('pointerup', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('lostpointercapture', release);
}

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;

  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }

  if (e.code === 'Space' && !e.repeat) attack();
  if (e.key.toLowerCase() === 'j') jump();
});

addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function jump() {
  if (!grounded) return;
  verticalVelocity = 7;
  grounded = false;
}

document.getElementById('jump').addEventListener('pointerdown', e => {
  e.preventDefault();
  jump();
});

function attack() {
  if (energyCooldown > 0) return;

  energyCooldown = 0.7;

  const forward = new THREE.Vector3(0, 0, -1);
  forward.applyQuaternion(player.quaternion);

  // Visual energy projectile.
  const projectile = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0x32dcff })
  );

  projectile.position.copy(player.position);
  projectile.position.y += 1.7;
  projectile.position.addScaledVector(forward, 1.2);
  scene.add(projectile);

  let distanceTravelled = 0;

  function fly() {
    if (!projectile.parent) return;

    projectile.position.addScaledVector(forward, 0.6);
    distanceTravelled += 0.6;

    for (const enemy of enemies) {
      if (enemy.health <= 0) continue;

      const target = enemy.mesh.position.clone();
      target.y += 1.6;

      if (projectile.position.distanceTo(target) < 1.1) {
        enemy.health -= 50;
        scene.remove(projectile);

        if (enemy.health <= 0) {
          scene.remove(enemy.mesh);
          document.getElementById('message').textContent =
            'Enemy eliminated. Keep moving, Ghost.';
        }

        updateHUD();
        return;
      }
    }

    if (distanceTravelled > 30) {
      scene.remove(projectile);
      return;
    }

    requestAnimationFrame(fly);
  }

  fly();
}

document.getElementById('attack').addEventListener('pointerdown', e => {
  e.preventDefault();
  attack();
});

function updateHUD() {
  document.getElementById('healthbar').style.width =
    Math.max(0, health) + '%';

  document.getElementById('stats').textContent =
    'ENEMIES: ' + enemies.filter(e => e.health > 0).length;
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  energyCooldown = Math.max(0, energyCooldown - dt);

  let forward = 0;
  let sideways = 0;

  if (movement.up || keys['w'] || keys['arrowup']) forward += 1;
  if (movement.down || keys['s'] || keys['arrowdown']) forward -= 1;
  if (movement.left || keys['a'] || keys['arrowleft']) sideways -= 1;
  if (movement.right || keys['d'] || keys['arrowright']) sideways += 1;

  const moving = forward !== 0 || sideways !== 0;

  if (moving) {
    const length = Math.hypot(forward, sideways);
    forward /= length;
    sideways /= length;

    const angle = Math.atan2(sideways, -forward);

    player.rotation.y = angle;

    player.position.x += Math.sin(angle) * 5 * dt;
    player.position.z -= Math.cos(angle) * 5 * dt;

    player.userData.legs.forEach((leg, i) => {
      leg.rotation.x = Math.sin(elapsed * 10 + i * Math.PI) * 0.55;
    });
  } else {
    player.userData.legs.forEach(leg => leg.rotation.x = 0);
  }

  // Keep the prototype inside its initial play area.
  player.position.x = THREE.MathUtils.clamp(player.position.x, -35, 35);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -75, 75);

  verticalVelocity -= 18 * dt;
  player.position.y += verticalVelocity * dt;

  if (player.position.y <= 0) {
    player.position.y = 0;
    verticalVelocity = 0;
    grounded = true;
  }

  // Camera follows the player.
  const cameraOffset = new THREE.Vector3(0, 5.5, 9);
  cameraOffset.applyQuaternion(player.quaternion);

  const desiredCamera = player.position.clone().add(cameraOffset);

  camera.position.lerp(desiredCamera, 1 - Math.exp(-5 * dt));

  const lookTarget = player.position.clone();
  lookTarget.y += 1.5;

  camera.lookAt(lookTarget);

  // Enemies move toward the player when nearby.
  for (const enemy of enemies) {
    if (enemy.health <= 0) continue;

    const dx = player.position.x - enemy.mesh.position.x;
    const dz = player.position.z - enemy.mesh.position.z;
    const distance = Math.hypot(dx, dz);

    if (distance < 18 && distance > 1.5) {
      enemy.mesh.position.x += dx / distance * dt * 1.3;
      enemy.mesh.position.z += dz / distance * dt * 1.3;
      enemy.mesh.rotation.y = Math.atan2(dx, dz);
    }

    if (distance < 2 && Math.random() < dt * 0.7) {
      health = Math.max(0, health - 5);
      updateHUD();

      if (health <= 0) {
        document.getElementById('message').textContent =
          'MISSION FAILED — Refresh to restart.';
      }
    }
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

camera.position.set(0, 6, 16);
animate();
</script>
</body>
</html>
